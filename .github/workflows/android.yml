name: Android checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: Verify build, JVM tests, lint and release packaging
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest :app:testDebugUnitTest :app:lintDebug :app:lintRelease :app:bundleRelease

  device-api36:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run API 36 instrumented tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: aosp_atd
          arch: x86_64
          ram-size: 2048M
          working-directory: android
          script: ./gradlew --no-daemon :app:connectedDebugAndroidTest

      - name: Verify API 36 test report
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          reports = list(Path('android/app/build/outputs/androidTest-results/connected/debug').glob('TEST-*.xml'))
          assert reports, 'No connected Android test report was generated'
          counts = {key: 0 for key in ('tests', 'failures', 'errors', 'skipped')}
          for report in reports:
              result = ET.parse(report).getroot()
              for key in counts:
                  counts[key] += int(result.get(key, 0))
          assert counts['tests'] >= 5, counts
          assert not any(counts[key] for key in ('failures', 'errors', 'skipped')), counts
          print(f"API 36 instrumented tests: {counts['tests']} passed")
          PY
